<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish to English Translator</title>
<style>
  body{font-family:Arial,sans-serif;background:#1e1e1e;color:#eee;margin:0;padding:20px;}
  h1{font-size:26px;margin:0 0 12px}
  textarea{width:100%;height:180px;font-size:20px;padding:10px;box-sizing:border-box;border-radius:8px;border:1px solid #555;background:#2b2b2b;color:#fff}
  button{font-size:20px;padding:12px 22px;margin:10px 8px 10px 0;border:0;border-radius:8px;cursor:pointer}
  #go{background:#2e7d32;color:#fff} #swap{background:#1565c0;color:#fff} #clear{background:#555;color:#fff} #copy{background:#6a1b9a;color:#fff}
  #status{color:#aaa;font-size:16px}
  label{font-size:18px;color:#bbb}
</style>
</head>
<body>
<h1 id="title">Spanish &rarr; English</h1>
<label id="inLabel">Paste Spanish here:</label>
<textarea id="input" placeholder="Escribe o pega el texto en español..."></textarea>
<div>
  <button id="go">Translate</button>
  <button id="swap">Switch direction</button>
  <button id="clear">Clear</button>
  <button id="copy">Copy result</button>
  <span id="status"></span>
</div>
<label id="outLabel">English:</label>
<textarea id="output" readonly></textarea>
<script>
let from="es", to="en";
const $=id=>document.getElementById(id);
function chunks(text){
  const parts=text.match(/[^.!?\n]+[.!?\n]*/g)||[text];
  const out=[];let cur="";
  for(const p of parts){
    if((cur+p).length>450){ if(cur) out.push(cur); cur=p; }
    else cur+=p;
  }
  if(cur.trim()) out.push(cur);
  return out;
}
async function translate(){
  const text=$("input").value.trim();
  if(!text){$("status").textContent="Nothing to translate.";return;}
  $("status").textContent="Translating...";$("output").value="";
  try{
    const results=[];
    for(const c of chunks(text)){
      const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair="+from+"|"+to;
      const r=await fetch(url);const j=await r.json();
      if(j.quotaFinished){throw new Error("Daily free limit reached. Try again tomorrow.");}
      results.push(j.responseData.translatedText);
    }
    $("output").value=results.join(" ");
    $("status").textContent="Done.";
  }catch(e){$("status").textContent="Error: "+e.message+" (check your internet connection)";}
}
$("go").onclick=translate;
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))translate();});
$("swap").onclick=()=>{
  [from,to]=[to,from];
  const es=from==="es";
  $("title").innerHTML=es?"Spanish &rarr; English":"English &rarr; Spanish";
  $("inLabel").textContent=es?"Paste Spanish here:":"Paste English here:";
  $("outLabel").textContent=es?"English:":"Spanish:";
  $("input").value=$("output").value;$("output").value="";$("status").textContent="";
};
$("clear").onclick=()=>{$("input").value="";$("output").value="";$("status").textContent="";};
$("copy").onclick=()=>{navigator.clipboard.writeText($("output").value);$("status").textContent="Copied.";};
</script>
</body>
</html>
